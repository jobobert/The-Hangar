<svg width="48" height="48" xmlns="http://www.w3.org/2000/svg">
 <g>
  <rect fill="#fff" height="50" width="50" y="-1" x="-1"/>
 </g>
 <g>
  <!-- Vertical mast -->
  <line x1="24" y1="4" x2="24" y2="39" stroke="#000" stroke-width="1.5"/>
  <!-- Base mount -->
  <rect x="18" y="39" width="12" height="5" rx="2" stroke="#000" stroke-width="1.5" fill="#fff"/>
  <!-- Yagi elements (reflector, driven element, 3 directors) -->
  <!-- Reflector (longest) -->
  <line x1="10" y1="34" x2="38" y2="34" stroke="#000" stroke-width="1.5"/>
  <!-- Driven element (feed point) -->
  <line x1="13" y1="25" x2="35" y2="25" stroke="#000" stroke-width="1.5"/>
  <!-- Director 1 -->
  <line x1="15" y1="17" x2="33" y2="17" stroke="#000" stroke-width="1.5"/>
  <!-- Director 2 -->
  <line x1="17" y1="11" x2="31" y2="11" stroke="#000" stroke-width="1.5"/>
  <!-- Director 3 (shortest) -->
  <line x1="19" y1="6" x2="29" y2="6" stroke="#000" stroke-width="1.5"/>
 </g>
</svg>
