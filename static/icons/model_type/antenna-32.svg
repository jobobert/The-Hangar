<svg width="32" height="32" xmlns="http://www.w3.org/2000/svg">
 <g>
  <rect fill="#fff" height="34" width="34" y="-1" x="-1"/>
 </g>
 <g>
  <!-- Vertical mast -->
  <line x1="16" y1="3" x2="16" y2="26" stroke="#000" stroke-width="1.5"/>
  <!-- Base mount -->
  <rect x="12" y="26" width="8" height="3" rx="1" stroke="#000" stroke-width="1.5" fill="#fff"/>
  <!-- Yagi elements (3 directors + driven element + reflector) -->
  <!-- Reflector (longest, near base) -->
  <line x1="7" y1="22" x2="25" y2="22" stroke="#000" stroke-width="1.5"/>
  <!-- Driven element -->
  <line x1="9" y1="16" x2="23" y2="16" stroke="#000" stroke-width="1.5"/>
  <!-- Director 1 -->
  <line x1="10" y1="11" x2="22" y2="11" stroke="#000" stroke-width="1.5"/>
  <!-- Director 2 -->
  <line x1="11" y1="6" x2="21" y2="6" stroke="#000" stroke-width="1.5"/>
 </g>
</svg>
