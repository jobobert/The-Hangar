<svg width="48" height="48" xmlns="http://www.w3.org/2000/svg">
 <g>
  <rect fill="#fff" height="50" width="50" y="-1" x="-1"/>
 </g>
 <g>
  <!-- Handheld transceiver body -->
  <rect x="13" y="12" width="22" height="29" rx="3" ry="3" stroke="#000" stroke-width="1.5" fill="#fff"/>
  <!-- Speaker grille -->
  <rect x="16" y="15" width="16" height="10" rx="1" stroke="#000" stroke-width="1" fill="#f0f0f0"/>
  <!-- Display -->
  <rect x="16" y="28" width="16" height="6" rx="1" stroke="#000" stroke-width="1" fill="#d0e8ff"/>
  <!-- Keypad dots -->
  <circle cx="20" cy="37" r="1.5" fill="#888"/>
  <circle cx="24" cy="37" r="1.5" fill="#888"/>
  <circle cx="28" cy="37" r="1.5" fill="#888"/>
  <!-- Antenna -->
  <line x1="29" y1="12" x2="34" y2="3" stroke="#000" stroke-width="1.5"/>
  <!-- PTT button -->
  <rect x="10" y="20" width="3" height="8" rx="1" stroke="#000" stroke-width="1" fill="#888"/>
 </g>
</svg>
